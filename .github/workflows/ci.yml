name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -c "import src.api.main"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t churn-api:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 churn-api:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break || sleep 3
          done
          docker rm -f api
