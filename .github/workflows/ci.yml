name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app
      - run: mypy
      - run: pytest -q --cov=churnkit --cov-report=term-missing
      # Gated on the platform packages only. churnkit/reference is the Telco
      # implementation being deleted module by module as the platform replaces
      # it, so covering it to 80% would be work with a known expiry date. The
      # include list grows with every platform module that lands.
      - run: coverage report --include="src/churnkit/ingest/*" --fail-under=80
      - run: python -c "import churnkit.reference.api.main"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t churnkit-api:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 churnkit-api:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break || sleep 3
          done
          docker rm -f api
