[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnkit"
version = "0.1.0.dev0"
description = "Self-hosted churn intelligence platform: upload a CSV, get calibrated per-customer churn scores with explanations and retention actions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Dhruv" }, { name = "Sanjida" }]

# Core dependencies are only what reading and describing an operator's data
# needs. The model stack is an extra on purpose: the Streamlit container
# installs churnkit without it, so that container cannot load a model even by
# accident and the API stays the single inference path.
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
ml = [
    "scikit-learn==1.6.0",
    "xgboost-cpu==3.4.1",
    "shap==0.52.0",
    "mlflow==2.16.2",
]
serving = [
    "churnkit[ml]",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
]
ui = [
    "streamlit==1.41.1",
    "requests==2.34.2",
]
# Reserved for the CLI (S10) and the HTML model card (S9). Declared now so the
# dependency set is agreed once rather than argued about mid-session.
cli = [
    "typer==0.15.1",
    "jinja2==3.1.6",
]
dev = [
    "churnkit[serving]",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.16.4",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Keeps `pytest` working straight out of a clone, before anyone has installed
# the package. CI installs it properly as well, so both paths are exercised.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["churnkit"]
branch = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The Telco reference implementation predates the type discipline and is being
# deleted module by module as the platform replaces it. Typing it strictly would
# be work invested in code with a known end date, so it is checked loosely and
# the strictness applies where the platform actually lives.
[[tool.mypy.overrides]]
module = "churnkit.reference.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["mlflow.*", "shap.*", "sklearn.*", "xgboost.*", "pandas.*", "streamlit.*"]
ignore_missing_imports = true
